<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-show-password/1.0.3/bootstrap-show-password.min.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/reset_password.js"></script>
    <link rel="stylesheet" href="../css/reset_password.css">
    <title>Reset Password</title>
    <link rel="icon" href="../image/captempire_icon.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center">Reset Password</h2>
                        <form id="resetPasswordForm">
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New Password</label>
                                <div class="password-wrapper">
                                <input type="password" class="form-control" id="newPassword" placeholder="Enter your new password" minlength="6" required>
                                <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                                    <i class="bi bi-eye-slash"></i>
                                </button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <div class="password-wrapper">
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your new password" minlength="6" required>
                                <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show password">
                                    <i class="bi bi-eye-slash"></i>
                                </button>
                                </div>
                            </div>
                            <div class="mb-3" id="message"></div>
                            <button type="submit" class="btn btn-primary w-100" id="resetPasswordBtn">Reset Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>  
    </div>
</body>
</html>
