<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://cdn.datatables.net/v/dt/dt-3.0.1/datatables.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.datatables.net/v/dt/dt-3.0.1/datatables.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/database.js"></script>
    <script src="../js/loaddata.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/admin_authcheck.js"></script>
    <script src="../js/live.js"></script>
    <link rel="stylesheet" href="../css/main.css">
    <title>Live Page</title>
    <link rel="icon" href="../image/captempire_icon.png" type="image/x-icon">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img src="../image/captempire_icon.png" alt="Logo" class="sidebar-logo">
                <span class="brand-text">Capt Empire</span>
            </div>
 
            <nav class="sidebar-nav">
                <a href="main.html" class="nav-link">
                    <i class="bi bi-grid-1x2-fill"></i> <span>Dashboard</span>
                </a>
                <a href="product.html" class="nav-link">
                    <i class="bi bi-box-seam-fill"></i> <span>Product</span>
                </a>
                <a href="lives.html" class="nav-link active">
                    <i class="bi bi-camera-reels-fill"></i> <span>Lives</span>
                </a>
                <a href="payout.html" class="nav-link">
                    <i class="bi bi-cash-coin"></i> <span>Payout</span>
                </a>
                <a href="report.html" class="nav-link">
                    <i class="bi bi-file-earmark-bar-graph-fill"></i> <span>Report</span>
                </a>
                <a href="user_management.html" class="nav-link">
                    <i class="bi bi-people-fill"></i> <span>User Management</span>
                </a>
            </nav>
 
            <div class="sidebar-footer">
                <a href="#" class="nav-link" onclick="logout(event)">
                    <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-topbar">
                <div class="topbar-user dropdown">
                    <a href="#" class="dropdown-toggle" id="topbarUserMenu" data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="user-name" id="user_name">Welcome</span>
                        <img src="../image/User-avatar.webp" alt="User avatar" class="avatar">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="topbarUserMenu">
                        <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person-circle"></i> Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="logout(event)">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a></li>
                    </ul>
                </div>
            </div>
        
            <div class="container-fluid">
            <div class="product-header">
                <h1 class="mt-4">Lives</h1>
                <ol class="breadcrumb mb-4 product-breadcrumb">
                    <li class="breadcrumb-item"><a href="main.html">Dashboard</a></li>
                    <li class="breadcrumb-item active">Lives</li>
                </ol>
            </div>


            <div class="row">
                <div class="col-md-12">
                    <div class="card product-card mb-4">
                        <div class="card-header">
                            <h1 class="card-title"><i class="bi bi-camera-reels-fill"></i> Live List</h1>
                        </div>
                        <div class="card-body"> 
                            <div class="table-responsive">
                                <table class="table table-bordered" id="LiveTable" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>Session ID</th>
                                            <th>Employee ID</th>
                                            <th style="min-width: 130px;">Date</th>
                                            <th>Day of Week</th>
                                            <th>Start Time</th>
                                            <th>End Time</th>
                                            <th>Duration (Hours)</th>
                                            <th>Items Sold</th>
                                            <th>GMV Amount</th>
                                            <th>Views</th>
                                            <th style="min-width: 175px;">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                                <div id="alertLives" class="alert alert-danger" role="alert" style="display: none;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
            <div class="modal fade" id="addLiveModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Add Live Data</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal">
                            </button>
                        </div>

                        <div class="modal-body">

                            <div class="mb-3">
                                <label class="form-label">Session ID</label>
                                <input type="text"class="form-control" id="sessionId">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Employee ID</label>
                                <select class="form-select" id="employeeId">
                                    <option value="">Loading employees...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" class="form-control" id="liveDate">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Day of Week</label>
                                <input type="text" id="dayOfWeek" class="form-control" readonly>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Start Time</label>
                                <input type="time" class="form-control" id="startTime">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">End Time</label>
                                <input type="time" class="form-control" id="endTime">   
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Duration (Hours)</label>
                                <input type="number" class="form-control" id="durationHours">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Items Sold</label>
                                <input type="number" class="form-control" id="itemsSold">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">GMV Amount</label>
                                <input type="number" class="form-control" id="gmvAmount">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Views</label>
                                <input type="number" class="form-control" id="views">
                            </div>

                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Cancel
                            </button>

                            <button type="button" class="btn btn-success" onclick="addLiveData()">
                                Add Live Data
                            </button>
                        </div>

                    </div>
                </div>
            </div>
            <div class="row justify-content-center mt-5">
                <div class="col-lg-3 col-md-6 text-center">
                    <button class="btn btn-primary w-100" id="add_lives_data"><i class="bi bi-plus-circle"></i> Add Lives Data</button>
                </div>
            </div>
    </main>
</div>
</body>
</html>
