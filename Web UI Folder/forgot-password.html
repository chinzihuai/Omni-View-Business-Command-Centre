<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/forget.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/database.js"></script>
    <link rel="stylesheet" href="../css/forget.css">
    <title>Forget Password ?</title>
    <link rel="icon" href="../image/captempire_icon.png" type="image/x-icon">
</head>
<body class="forgot-page">
    <div class="container text-center">
        <div class ="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="forgot-card card">
                    <div class="card-body">
                        <h1><strong>Forgot Password?</strong> </h1>
                        <p class="text-muted">Enter your email address and we'll send you a link to reset your password.</p>
                        <form id="forgotPasswordForm">
                            <div class="mb-3">
                                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                        </form>
                        <div class="mt-3">
                            <a href="index.html" class="text-decoration-none">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();

        if (!email) {
            alert('Please enter your email address.');
            return;
        }

        const {error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: 'http://127.0.0.1:5500/Omni-View-Business-Command-Centre/Web%20UI%20Folder/reset_password.html', // Replace with your actual redirect URL
        });

        if (error) {
            alert('Error sending reset link: ' + error.message);
        } else {
            alert('A password reset link has been sent to your email address.');
        }
    });
</script>
