<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/database.js"></script>
    <script src="../js/loaddata.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/authcheck.js"></script>
    <link rel="stylesheet" href="../css/main.css">
    <title>Dashboard Capt Empire</title>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img src="../image/captempire_icon.png" alt="Logo" class="sidebar-logo">
                <span class="brand-text">Capt Empire</span>
            </div>
 
            <nav class="sidebar-nav">
                <a href="main.html" class="nav-link active">
                    <i class="bi bi-grid-1x2-fill"></i> <span>Dashboard</span>
                </a>
                <a href="product.html" class="nav-link">
                    <i class="bi bi-box-seam-fill"></i> <span>Product</span>
                </a>
                <a href="lives.html" class="nav-link">
                    <i class="bi bi-camera-reels-fill"></i> <span>Lives</span>
                </a>
                <a href="payout.html" class="nav-link">
                    <i class="bi bi-cash-coin"></i> <span>Payout</span>
                </a>
                <a href="report.html" class="nav-link">
                    <i class="bi bi-file-earmark-bar-graph-fill"></i> <span>Report</span>
                </a>
            </nav>
 
            <div class="sidebar-footer">
                <a href="#" class="nav-link" onclick="logout(event)">
                    <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-topbar " >
                <div class="topbar-user dropdown">
                    <a href="#" class="dropdown-toggle" id="topbarUserMenu" data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="user-name" id="user_name">Welcome</span>
                        <img src="../image/User-avatar.webp" alt="User avatar" class="avatar">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="topbarUserMenu">
                        <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person-circle"></i> Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="logout(event)">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a></li>
                    </ul>
                </div>
            </div>

            <div class="container-fluid">
                    <div class="product-header">
                        <div class="row col-lg-12 g-4 justify-content-center">
                            <h1 class="mt-4 col-lg-11">Dashboard</h1>
                            <a href="report.html" class="btn btn-primary col-lg-1 col-md-6" id="report_download">
                                <i class="bi bi-download"></i> Report
                            </a>
                        </div>
                        
                    </div>

                <div class="container-fluid mt-4">
                    <div class="row g-4">
                        <p class="alert alert-warning">This is just a sample card</p>
                        <div class="col-md-6">
                            <div class="stat-card">
                                <div>
                                    <div class="stat-card-label">Earnings (Monthly)</div>
                                    <div class="stat-card-value">$40,000</div>
                                </div>
                                <div class="stat-card-icon bg-primary-light">
                                    <i class="bi bi-calendar-event"></i>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="stat-card ">
                                <div>
                                    <div class="stat-card-label">Earnings (Annual)</div>
                                    <div class="stat-card-value">$215,000</div>
                                </div>
                                <div class="stat-card-icon bg-success-light">
                                    <i class="bi bi-currency-dollar"></i>
                                </div>
                            </div>
                        </div>
                        
                    </div>

                    <div class="row g-4 mt-4">
                        <p class="alert alert-warning">This is just a sample chart</p>
                        <!-- Earnings Overview -->
                        <div class="col-md-7">
                            <div class="card">
                                <div class="card-header">
                                    <h1 class="card-title mb-0 text-primary">Earnings Overview</h1>
                                </div>
                                <div class="card-body">
                                    <canvas id="earningsChart" width="400" height="200">
                                    </canvas>
                                </div>
                            </div>
                        </div>

                        <!-- platform sales -->
                        <div class="col-md-5">
                            <div class="card">
                                <div class="card-header">
                                    <h1 class="card-title mb-0 text-primary">Platform Sales</h1>
                                </div>
                                <div class="card-body">
                                    <canvas id="salesChart" width="400" height="200">
                                    </canvas>
                                </div>
                            </div>
                        </div>

                        <!-- example chart-->
                                 <script type="module">
                                    const exampleChart = document.getElementById('earningsChart');
                                    const salesChart = document.getElementById('salesChart');

                                    new Chart(exampleChart, {
                                        type: 'line',
                                        data: {
                                            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                                            datasets: [{
                                                label: 'Earnings',
                                                data: [12000, 15000, 14000, 17000, 18000, 20000, 22000, 21000, 23000, 25000, 24000, 26000],
                                                borderColor: '#4e73df',
                                                backgroundColor: 'rgba(78, 115, 223, 0.05)',
                                                fill: true,
                                                tension: 0.4
                                            }]
                                        },
                                        options: {
                                            responsive: true,
                                            plugins: {
                                                legend: {
                                                    display: false
                                                }
                                            },
                                            scales: {
                                                x: {
                                                    grid: {
                                                        display: false
                                                    }
                                                },
                                                y: {
                                                    beginAtZero: true,
                                                    grid: {
                                                        color: '#e9ecef'
                                                    }
                                                }
                                            }
                                        }
                                    });

                                    new Chart(salesChart, {
                                        type: 'doughnut',
                                        data: {
                                            labels: ['Physical Store', 'Online', 'Tiktok Shop'],
                                            datasets: [{
                                                label: 'Sales',
                                                data: [55, 30, 15],
                                                backgroundColor: ['#4e73df', '#1cc88a', '#36b9cc'],
                                                hoverOffset: 4
                                            }]
                                        },
                                        options: {
                                            responsive: true,
                                            plugins: {
                                                legend: {
                                                    position: 'bottom'
                                                }
                                            }
                                        }
                                    });
                                 </script>

                    </div> 
                </div>
            </div>
        </main>
    </div>
</body>
</html>
