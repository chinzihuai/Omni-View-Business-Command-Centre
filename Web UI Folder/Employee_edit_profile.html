<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/database.js"></script>
    <script src="../js/loaddata.js"></script>
    <script src="../js/editprofile.js"></script>
    <script src="../js/authcheck.js"></script>
    <link rel="stylesheet" href="../css/edit_profile.css">
    <title>Edit your profile</title>
    <link rel="icon" href="../image/captempire_icon.png" type="image/x-icon">
</head>
<body class="profile-page">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6" >
                <div class="card">
                    <div class="card-body">
                        <h1 class="card-title text-center"><strong>Edit Profile</strong></h1>
                        <form id="editProfileForm" class="mt-4" onsubmit="updateProfile(event)">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name:</label>
                                <input type="text" class="form-control" id="update_name" placeholder="Enter your name" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone:</label>
                                <input type="tel" class="form-control" id="update_phone" placeholder="Enter your phone number" required>
                            </div>
                            <div class="row g-4 col-lg-12 justify-content-center mt-4">
                                <div class="col-lg-5">
                                    <a class="btn btn-secondary w-100 mb-3" href="Employee_Profile.html"><i class="bi bi-arrow-left"></i> Back to Profile</a>
                                </div>
                                <div class="col-lg-5">
                                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                                </div>
                            </div>
                        </form>
                        <div class="mt-3 text-center">
                            <div class="alert alert-success d-none" id="updateMessage" role="alert" style="display: none;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
