<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    html {
      scroll-behavior: smooth;
    }

    :root {
      color-scheme: light;
      --ink: #1f221d;
      --muted: #5c625c;
      --accent: #c69b52;
      --surface: #fffdf9;
      --line: #e8e1d7;
      --soft-panel: #f4efe9;
      --soft-button: #ffffff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 8%, rgba(198, 155, 82, 0.12), transparent 32rem),
        #f5f3ef;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page-shell {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 4rem 1.25rem;
      color: var(--ink);
      background:#f7f3ee;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: left;
    }

    .brand-logo {
      width: 5rem;
      height: 5rem;
      border: 1px solid var(--line);
      border-radius: .5rem;
      object-fit: cover;
    }

    .brand-copy h1,
    .brand-copy h2 {
      margin: 0;
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: -.045em;
    }

    .brand-copy p {
      margin: .25rem 0 0;
      color: #303234;
    }

    .link-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
      width: min(100%, 58rem);
    }

    .link-card {
      width: 100%;
      padding: clamp(1.25rem, 4vw, 2rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 18px 40px rgba(60, 54, 40, 0.08);
    }

    .category h2 {
      margin: 0 0 1.25rem;
      color: #1b1d1a;
      text-align: center;
      font-size: .9rem;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .link-list {
      display: grid;
      gap: .75rem;
    }

    .category-link {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1rem;
      min-height: 3.5rem;
      padding: .85rem 1rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      color: #1d1d1b;
      background: var(--soft-button);
      font-weight: 550;
      text-decoration: none;
      transition: border-color .18s ease, background-color .18s ease, transform .18s ease;
    }

    .category-link i {
      flex: 0 0 1.5rem;
      color: #c69b52;
      font-size: 1.25rem;
      text-align: center;
    }
    
    .category-link:hover {
      transform: translateY(-2px);
      border-color: rgba(198, 155, 82, .8);
      background: #f3ead8;
      color: #171815;
    }

    .category-link:focus-visible {
      outline: 3px solid rgba(198, 155, 82, .75);
      outline-offset: 3px;
    }

    @media (max-width: 767.98px) {
      .link-columns {
        grid-template-columns: 1fr;
      }

      .page-heading {
        flex-direction: column;
        gap: .75rem;
        text-align: center;
        font-size: 1rem;
      }

      .brand-logo {
        width: 5.5rem;
        height: 5.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell container">
    <header class="page-heading">
      <img class="brand-logo" src="image/captempire_icon.png" alt="Logo">
      <div class="brand-copy">
        <h2>Omni-View</h2>
        <p>Business Command Centre</p>
      </div>
    </header>

    <nav class="link-columns" aria-label="Page categories">
      <section class="link-card category" aria-labelledby="category-one-title">
        <h2 id="category-one-title">Quick Links</h2>
        <div class="link-list">
          <a class="category-link" href="./Web%20Ui/login.html">
            <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
            <span>Dashboard Login </span>
          </a>
          <a class="category-link" href="https://github.com/chinzihuai/Omni-View-Business-Command-Centre">
            <i class="bi bi-github" aria-hidden="true"></i>
            <span>GitHub Repository</span>
          </a>
        </div>
      </section>

      <section class="link-card category" aria-labelledby="category-two-title">
        <h2 id="category-two-title">Documentation</h2>
        <div class="link-list">
          <a class="category-link" href="https://drive.google.com/file/d/17C2PtrudbEZ_JJXvclEy2vGTxm0V7UiJ/view?usp=sharing">
            <i class="bi bi-journal-text" aria-hidden="true"></i>
            <span>User Manual</span>
          </a>
        </div>
      </section>
    </nav>
  </main>
</body>
</html>
